[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "smartocr"
version = "1.1.0"
description = "Fast local OCR CLI using RapidOCR and ONNX Runtime"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "MR-Kartoshki" }]
dependencies = [
    "rapidocr>=3.9,<4",
    "onnxruntime>=1.29,<2",
    "PyMuPDF>=1.24,<2",
]

[project.scripts]
smartocr = "smartocr:main"

[tool.setuptools]
py-modules = ["smartocr"]
